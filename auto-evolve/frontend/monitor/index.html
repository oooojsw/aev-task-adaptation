<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auto Evolve Session Monitor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1014;
        --panel: rgba(18, 24, 30, 0.92);
        --panel-strong: rgba(20, 28, 35, 0.98);
        --line: #26323b;
        --muted: #8fa2b3;
        --text: #eef4f8;
        --accent: #68a7ff;
        --running: #4dc27f;
        --retry: #f0b44f;
        --done: #5ea3ff;
        --error: #ff6e72;
        --archived: #8d7fff;
        --idle: #7f8b95;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.32);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(91, 141, 255, 0.12), transparent 24%),
          radial-gradient(circle at top right, rgba(64, 196, 131, 0.1), transparent 22%),
          linear-gradient(180deg, #091015 0%, #0b1217 42%, #0f161c 100%);
        color: var(--text);
        overflow: hidden;
      }
      .shell {
        height: 100vh;
        padding: 22px;
        display: grid;
        grid-template-rows: auto auto 1fr;
        gap: 14px;
        max-width: 1800px;
        margin: 0 auto;
      }
      .hero {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: flex-start;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.24em;
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 6px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 780;
        letter-spacing: -0.02em;
      }
      .subtitle {
        margin: 8px 0 0;
        max-width: 52ch;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .controls label,
      .controls button,
      .controls input {
        font-size: 14px;
      }
      .controls label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }
      .controls input {
        width: 110px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 12px;
        outline: none;
      }
      .controls button,
      .chip {
        border: 1px solid var(--line);
        background: rgba(21, 28, 34, 0.92);
        color: var(--text);
        border-radius: 12px;
        padding: 10px 12px;
        transition:
          transform 140ms ease,
          border-color 140ms ease,
          background 140ms ease;
        cursor: pointer;
      }
      .controls button:hover,
      .chip:hover,
      .tile:hover {
        transform: translateY(-1px);
        border-color: rgba(104, 167, 255, 0.7);
        box-shadow:
          0 0 0 1px rgba(104, 167, 255, 0.12),
          var(--shadow);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .stat {
        background: rgba(15, 21, 26, 0.88);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px 11px 9px;
        min-height: 62px;
        display: grid;
        gap: 4px;
        align-content: start;
      }
      .stat-label {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .stat-value {
        font-size: 18px;
        font-weight: 760;
        line-height: 1;
      }
      .pinned-strip {
        display: grid;
        grid-template-columns: minmax(360px, 1fr) minmax(480px, 1.25fr);
        gap: 10px;
        min-height: 0;
      }
      .pinned-card {
        background: var(--panel-strong);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
        min-height: 0;
      }
      .pinned-left {
        padding: 12px 12px 10px;
        display: grid;
        gap: 8px;
        align-content: start;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
      }
      .split {
        display: grid;
        grid-template-columns: minmax(320px, var(--left-width, 40%)) 8px minmax(420px, 1fr);
        min-height: 0;
        gap: 0;
        border: 1px solid var(--line);
        border-radius: 22px;
        overflow: hidden;
        background: rgba(11, 16, 20, 0.34);
        box-shadow: var(--shadow);
      }
      .pane {
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: rgba(16, 22, 28, 0.82);
      }
      .pane.left {
        border-right: 1px solid var(--line);
      }
      .pane.right {
        border-left: 1px solid var(--line);
      }
      .pane-head {
        padding: 18px 18px 10px;
        border-bottom: 1px solid rgba(38, 50, 59, 0.7);
      }
      .pane-head h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.01em;
      }
      .pane-head p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }
      .pane-body {
        min-height: 0;
        overflow: auto;
        padding: 14px 16px 16px;
      }
      .tile-wrap {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
        align-content: start;
      }
      .tile {
        position: relative;
        display: grid;
        gap: 9px;
        text-align: left;
        padding: 12px 12px 11px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(27, 35, 43, 0.96) 0%, rgba(15, 21, 26, 0.96) 100%);
        color: var(--text);
        cursor: pointer;
        min-height: 148px;
        align-content: start;
        overflow: hidden;
        transition:
          transform 140ms ease,
          border-color 140ms ease,
          box-shadow 140ms ease,
          background 140ms ease;
      }
      .tile::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: linear-gradient(180deg, rgba(104, 167, 255, 0.95), rgba(64, 196, 131, 0.65));
        opacity: 0;
        transition:
          width 140ms ease,
          opacity 140ms ease;
      }
      .tile.selected {
        transform: translateY(-2px);
        border-color: rgba(104, 167, 255, 0.95);
        background:
          radial-gradient(circle at top right, rgba(104, 167, 255, 0.16), transparent 34%),
          linear-gradient(180deg, rgba(32, 43, 55, 0.98) 0%, rgba(16, 23, 30, 0.98) 100%);
        box-shadow:
          0 0 0 1px rgba(104, 167, 255, 0.34),
          0 16px 38px rgba(0, 0, 0, 0.36),
          0 0 26px rgba(104, 167, 255, 0.16);
      }
      .tile.selected::before {
        width: 4px;
        opacity: 1;
      }
      .tile.selected .tile-title {
        color: #f7fbff;
      }
      .tile.selected .tile-detail,
      .tile.selected .tile-footer,
      .tile.selected .tile-top {
        color: #b9cce1;
      }
      .tile.selected .badge {
        border-color: rgba(104, 167, 255, 0.34);
        background: rgba(104, 167, 255, 0.1);
      }
      .tile.selected .badge.status-done,
      .tile.selected .badge.status-running,
      .tile.selected .badge.status-retry,
      .tile.selected .badge.status-error,
      .tile.selected .badge.status-archived,
      .tile.selected .badge.status-idle {
        background: rgba(104, 167, 255, 0.14);
      }
      .tile-top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: flex-start;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        font-size: 11px;
        white-space: nowrap;
      }
      .tile-title {
        font-size: 15px;
        line-height: 1.28;
        font-weight: 720;
        letter-spacing: -0.01em;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
      }
      .tile-detail {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        min-height: 36px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .tile-footer {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        color: var(--muted);
        font-size: 11px;
      }
      .tile-footer.compact {
        margin-top: auto;
        gap: 6px;
      }
      .tile-footer .mono {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .status-running {
        color: var(--running);
        border-color: rgba(77, 194, 127, 0.38);
      }
      .status-retry {
        color: var(--retry);
        border-color: rgba(240, 180, 79, 0.38);
      }
      .status-done {
        color: var(--done);
        border-color: rgba(94, 163, 255, 0.38);
      }
      .status-error {
        color: var(--error);
        border-color: rgba(255, 110, 114, 0.38);
      }
      .status-archived {
        color: var(--archived);
        border-color: rgba(141, 127, 255, 0.38);
      }
      .status-idle {
        color: var(--idle);
        border-color: rgba(127, 139, 149, 0.38);
      }
      .kind-pipeline {
        color: #b8d7ff;
      }
      .kind-ad_hoc {
        color: #bcc6d2;
      }
      .splitter {
        cursor: col-resize;
        background: linear-gradient(180deg, rgba(104, 167, 255, 0.06), rgba(255, 255, 255, 0.02));
        position: relative;
      }
      .splitter::before {
        content: "";
        position: absolute;
        inset: 0;
        width: 2px;
        margin: 0 auto;
        background: linear-gradient(180deg, transparent, rgba(104, 167, 255, 0.55), transparent);
        opacity: 0.8;
      }
      .detail-shell {
        display: flex;
        min-height: 0;
        flex: 1;
      }
      .detail-top {
        padding: 18px 18px 14px;
        display: grid;
        gap: 8px;
      }
      .pinned-card .detail-top {
        padding: 12px 12px 10px;
      }
      .detail-title-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: start;
      }
      .detail-title-row > div:first-child {
        min-width: 0;
      }
      .detail-title-row h3 {
        margin: 0;
        font-size: 20px;
        line-height: 1.24;
        letter-spacing: -0.02em;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .detail-sub {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }
      .detail-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .detail-actions .chip {
        padding: 6px 10px;
        font-size: 12px;
      }
      .facts {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .fact {
        background: rgba(15, 22, 28, 0.82);
        border: 1px solid rgba(38, 50, 59, 0.85);
        border-radius: 12px;
        padding: 9px 9px 8px;
        min-height: 58px;
        display: grid;
        gap: 4px;
        align-content: start;
        min-width: 0;
      }
      .fact-label {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 10px;
      }
      .fact-value {
        font-size: 12px;
        line-height: 1.35;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .detail-body {
        min-height: 0;
        overflow: auto;
        padding: 16px 18px 18px;
        display: grid;
        gap: 14px;
        align-content: start;
        flex: 1;
      }
      .section {
        background: rgba(15, 22, 28, 0.78);
        border: 1px solid rgba(38, 50, 59, 0.82);
        border-radius: 18px;
        padding: 14px 14px 12px;
        display: grid;
        gap: 10px;
      }
      .section-title {
        color: #dbe7f2;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 11px;
      }
      .section-body {
        color: var(--text);
        font-size: 14px;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .actions {
        display: grid;
        gap: 8px;
      }
      .action {
        border: 1px solid rgba(38, 50, 59, 0.88);
        border-radius: 14px;
        padding: 10px 11px;
        background: rgba(20, 27, 33, 0.96);
        display: grid;
        gap: 6px;
      }
      .action-label {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #bdd4e8;
      }
      .action-time {
        color: var(--muted);
        font-size: 12px;
      }
      .action-detail {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
        word-break: break-word;
      }
      .empty {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
        padding: 4px 0;
      }
      .context-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .context-item {
        display: grid;
        gap: 4px;
        padding: 10px 11px;
        border: 1px solid rgba(38, 50, 59, 0.78);
        border-radius: 14px;
        background: rgba(20, 27, 33, 0.92);
      }
      .context-label {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      .context-value {
        font-size: 13px;
        line-height: 1.45;
        word-break: break-word;
      }
      .mono {
        font-family: Consolas, "SFMono-Regular", Menlo, monospace;
        font-size: 12px;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 5px 9px;
        border: 1px solid var(--line);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }
      .status-pill.running,
      .dot.running {
        color: var(--running);
      }
      .status-pill.retry,
      .dot.retry {
        color: var(--retry);
      }
      .status-pill.done,
      .dot.done {
        color: var(--done);
      }
      .status-pill.error,
      .dot.error {
        color: var(--error);
      }
      .status-pill.archived,
      .dot.archived {
        color: var(--archived);
      }
      .status-pill.idle,
      .dot.idle {
        color: var(--idle);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: currentColor;
        box-shadow: 0 0 12px currentColor;
        display: inline-block;
      }
      @media (max-width: 1180px) {
        body {
          overflow: auto;
        }
        .shell {
          height: auto;
          min-height: 100vh;
        }
        .split {
          grid-template-columns: 1fr;
        }
        .splitter {
          display: none;
        }
        .stats {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .pinned-strip {
          grid-template-columns: 1fr;
        }
        .facts {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .context-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div>
          <div class="eyebrow">Auto Evolve</div>
          <h1>Session Monitor</h1>
          <p class="subtitle">Compact wall + selected session focus.</p>
        </div>
        <div class="controls">
          <label
            >Refresh (sec) <input id="interval" type="number" min="1" value="__MONITOR_INTERVAL_SECONDS__"
          /></label>
          <label>Rows <input id="limit" type="number" min="1" value="__MONITOR_LIMIT__" /></label>
          <button id="refresh">Refresh now</button>
          <span class="meta" id="last-updated">Not refreshed yet</span>
        </div>
      </header>

      <section class="pinned-strip">
        <div class="pinned-card pinned-left">
          <div class="stats" id="summary"></div>
          <div class="meta" id="wall-meta">Loading...</div>
        </div>
        <div class="pinned-card pinned-right">
          <div class="detail-top">
            <div class="detail-title-row">
              <div>
                <h3 id="detail-title">Select a session</h3>
                <div class="detail-sub" id="detail-sub">
                  Choose a tile on the left to inspect why this session exists and what it did last.
                </div>
              </div>
              <div class="status-pill idle" id="detail-status"><span class="dot idle"></span><span>idle</span></div>
            </div>
            <div class="detail-actions" id="detail-actions"></div>
            <div class="facts" id="facts"></div>
          </div>
        </div>
      </section>

      <main class="split" id="split-root">
        <section class="pane left">
          <div class="pane-body">
            <div class="tile-wrap" id="rows">
              <div class="empty">Loading...</div>
            </div>
          </div>
        </section>

        <div class="splitter" id="splitter" title="Drag to resize"></div>

        <section class="pane right">
          <div class="detail-shell">
            <div class="detail-body" id="detail-body"></div>
          </div>
        </section>
      </main>
    </div>

    <script>
      const LIMIT_DEFAULT = Number("__MONITOR_LIMIT__")
      const INTERVAL_DEFAULT = Number("__MONITOR_INTERVAL_SECONDS__")
      const summaryEl = document.getElementById("summary")
      const rowsEl = document.getElementById("rows")
      const factsEl = document.getElementById("facts")
      const detailBodyEl = document.getElementById("detail-body")
      const detailTitleEl = document.getElementById("detail-title")
      const detailSubEl = document.getElementById("detail-sub")
      const detailActionsEl = document.getElementById("detail-actions")
      const detailStatusEl = document.getElementById("detail-status")
      const lastUpdatedEl = document.getElementById("last-updated")
      const intervalEl = document.getElementById("interval")
      const limitEl = document.getElementById("limit")
      const refreshBtn = document.getElementById("refresh")
      const wallMetaEl = document.getElementById("wall-meta")
      const splitRoot = document.getElementById("split-root")
      const splitter = document.getElementById("splitter")

      const state = {
        rows: [],
        selectedId: null,
        hasManualSelection: false,
        timer: null,
        refreshing: false,
        pendingRefresh: false,
        leftWidth: 44,
        timelineBySession: {},
        timelineLoading: {},
        timelineErrors: {},
      }

      function esc(input) {
        return String(input ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;")
      }

      function shortText(input, max = 120) {
        const text = String(input ?? "")
          .replace(/\s+/g, " ")
          .trim()
        if (!text) return ""
        return text.length > max ? text.slice(0, max - 3) + "..." : text
      }

      function shortId(input) {
        const text = String(input ?? "")
        if (!text) return ""
        return text.length > 18 ? text.slice(0, 8) + "..." + text.slice(-6) : text
      }

      function timeText(timestamp) {
        return new Date(timestamp).toLocaleString("zh-CN", { hour12: false })
      }

      function statusClass(status) {
        return "status-" + status
      }

      function rowTrack(row) {
        const kind = row.monitorKind || (row.task ? "pipeline" : "ad_hoc")
        return kind === "pipeline" ? "PIPELINE" : "AD HOC"
      }

      function phaseLabel(row) {
        return [row.task?.kind, row.task?.phase].filter(Boolean).join(" / ") || row.step || "idle"
      }

      function roundLabel(row) {
        if (typeof row.roundNumber === "number" && Number.isFinite(row.roundNumber)) {
          return "round-" + String(row.roundNumber).padStart(3, "0")
        }
        if (typeof row.task?.maintenanceRound === "number" && Number.isFinite(row.task.maintenanceRound)) {
          return "round-" + String(row.task.maintenanceRound).padStart(3, "0")
        }
        return ""
      }

      function isLifecycleRow(row) {
        return String(row?.id || "").startsWith("lifecycle:")
      }

      function actionCount(row) {
        return Array.isArray(row?.recentActions) ? row.recentActions.length : 0
      }

      function getDisplayRows(rows) {
        return [...rows].sort((a, b) => {
          const aLifecycle = isLifecycleRow(a) ? 1 : 0
          const bLifecycle = isLifecycleRow(b) ? 1 : 0
          if (aLifecycle !== bLifecycle) return aLifecycle - bLifecycle

          const aHasActions = actionCount(a) > 0 ? 0 : 1
          const bHasActions = actionCount(b) > 0 ? 0 : 1
          if (aHasActions !== bHasActions) return aHasActions - bHasActions

          return b.updated - a.updated
        })
      }

      function getRowsForLimit() {
        return getDisplayRows(state.rows).slice(0, Math.max(1, Number(limitEl.value || LIMIT_DEFAULT)))
      }

      function pickPreferredRow(candidates) {
        if (!Array.isArray(candidates) || candidates.length === 0) return null
        return (
          candidates.find((row) => !isLifecycleRow(row) && actionCount(row) > 0) ||
          candidates.find((row) => !isLifecycleRow(row)) ||
          candidates[0]
        )
      }

      function chooseSelectedRowID(rows, currentSelectedID, keepManualSelection) {
        const displayRows = getDisplayRows(rows)
        const preferred = pickPreferredRow(displayRows)
        if (!preferred) return null

        if (!currentSelectedID) return preferred.id
        const current = rows.find((row) => row.id === currentSelectedID)
        if (!current) return preferred.id
        if (keepManualSelection) return current.id

        if (isLifecycleRow(current) && !isLifecycleRow(preferred)) return preferred.id
        if (actionCount(current) === 0 && actionCount(preferred) > 0) return preferred.id
        return current.id
      }

      function renderSummary(rows) {
        const counts = {
          total: rows.length,
          active: rows.filter((row) => row.status === "running" || row.status === "retry").length,
          running: rows.filter((row) => row.status === "running").length,
          retry: rows.filter((row) => row.status === "retry").length,
          done: rows.filter((row) => row.status === "done").length,
          error: rows.filter((row) => row.status === "error").length,
          archived: rows.filter((row) => row.status === "archived").length,
        }
        summaryEl.innerHTML = [
          ["Active", counts.active],
          ["Total", counts.total],
          ["Running", counts.running],
          ["Retry", counts.retry],
          ["Done", counts.done],
          ["Error", counts.error],
          ["Archived", counts.archived],
        ]
          .map(
            ([label, value]) =>
              '<div class="stat"><div class="stat-label">' +
              esc(label) +
              '</div><div class="stat-value">' +
              value +
              "</div></div>",
          )
          .join("")
      }

      function tileDetail(row) {
        return shortText(
          row.statusReason ||
            row.nextStepReason ||
            row.whyStarted ||
            row.detail ||
            row.lastUser ||
            "No short detail yet.",
          120,
        )
      }

      function renderRows(rows) {
        const displayRows = getRowsForLimit()
        wallMetaEl.textContent = displayRows.length + " shown / " + state.rows.length + " loaded"
        if (!displayRows.length) {
          rowsEl.innerHTML = '<div class="empty">No sessions loaded yet.</div>'
          return
        }
        rowsEl.innerHTML = displayRows
          .map((row) => {
            const kind = rowTrack(row)
            const selected = row.id === state.selectedId ? " selected" : ""
            const title = esc(row.title || row.id)
            const detail = esc(tileDetail(row))
            const round = roundLabel(row)
            return (
              '<button class="tile ' +
              statusClass(row.status) +
              selected +
              '" data-id="' +
              esc(row.id) +
              '">' +
              '<div class="tile-top">' +
              '<span class="badge ' +
              statusClass(row.status) +
              '">' +
              esc(row.status) +
              "</span>" +
              '<span class="badge kind-' +
              esc((row.monitorKind || (row.task ? "pipeline" : "ad_hoc")).replace(/[^a-z_]/g, "")) +
              '">' +
              esc(kind) +
              "</span>" +
              (round ? '<span class="badge">' + esc(round) + "</span>" : "") +
              "</div>" +
              '<div class="tile-title">' +
              title +
              "</div>" +
              '<div class="tile-detail">' +
              detail +
              "</div>" +
              '<div class="tile-footer compact">' +
              "<span>" +
              esc(phaseLabel(row)) +
              "</span>" +
              "<span>" +
              esc(timeText(row.updated)) +
              "</span>" +
              "</div>" +
              '<div class="tile-footer compact">' +
              '<span class="mono">' +
              esc(shortId(row.id)) +
              "</span>" +
              "</div>" +
              "</button>"
            )
          })
          .join("")

        rowsEl.querySelectorAll("[data-id]").forEach((tile) => {
          tile.addEventListener("click", () => {
            state.selectedId = tile.getAttribute("data-id")
            state.hasManualSelection = true
            renderDetail()
            renderRows(state.rows)
          })
        })
      }

      function renderFacts(row) {
        const facts = [
          ["Status", row.status],
          ["Step", row.step || "idle"],
          ["Type", rowTrack(row)],
          ["Phase", row.task?.phase || row.task?.kind || "n/a"],
          ["Case", row.task?.caseID || "n/a"],
          ["Attempt", row.task?.attempt ?? "n/a"],
          ["Round", roundLabel(row) || "n/a"],
          ["Method", row.task?.methodID || "n/a"],
        ]
        factsEl.innerHTML = facts
          .map(
            ([label, value]) =>
              '<div class="fact"><div class="fact-label">' +
              esc(label) +
              '</div><div class="fact-value">' +
              esc(value) +
              "</div></div>",
          )
          .join("")
      }

      function renderSection(title, body) {
        return (
          '<section class="section">' +
          '<div class="section-title">' +
          esc(title) +
          "</div>" +
          '<div class="section-body">' +
          body +
          "</div>" +
          "</section>"
        )
      }

      function renderActionList(actions) {
        if (!actions?.length) return '<div class="empty">No recent actions recorded.</div>'
        return (
          '<div class="actions">' +
          actions
            .map(
              (action) => {
                const ts = Number(action?.timestamp || 0)
                const when = Number.isFinite(ts) && ts > 0 ? '<div class="action-time">' + esc(timeText(ts)) + "</div>" : ""
                return (
                '<div class="action">' +
                '<div class="action-label">' +
                esc(action.label) +
                "</div>" +
                when +
                (action.detail ? '<div class="action-detail">' + esc(action.detail) + "</div>" : "") +
                "</div>"
                )
              },
            )
            .join("") +
          "</div>"
        )
      }

      function buildOpenCodeSessionDeepLink(row) {
        const sessionID = String(row?.id || "")
        const directory = String(row?.directory || "")
        if (!sessionID || !directory) return null
        if (sessionID.startsWith("artifact:")) return null
        return (
          "opencode://open-session?directory=" +
          encodeURIComponent(directory) +
          "&sessionID=" +
          encodeURIComponent(sessionID)
        )
      }

      function isSessionTimelineRow(row) {
        const sessionID = String(row?.id || "")
        if (!sessionID) return false
        if (sessionID.startsWith("artifact:")) return false
        if (sessionID.startsWith("lifecycle:")) return false
        return true
      }

      function sessionTimelineMeta(entry) {
        if (!entry) return ""
        const generatedAt = Number(entry.generatedAt || 0)
        const generated = Number.isFinite(generatedAt) && generatedAt > 0 ? timeText(generatedAt) : "n/a"
        return (
          '<div style="margin-bottom:8px;color:var(--muted);font-size:12px;">' +
          "messages: " +
          esc(entry.messageCount ?? 0) +
          " / actions: " +
          esc(entry.actionCount ?? 0) +
          " / fetched: " +
          esc(generated) +
          "</div>"
        )
      }

      function renderSessionTimeline(row) {
        if (!isSessionTimelineRow(row)) {
          return '<div class="empty">This row does not map to a concrete session timeline.</div>'
        }

        const sessionID = String(row.id)
        const entry = state.timelineBySession[sessionID]
        const loading = !!state.timelineLoading[sessionID]
        const error = state.timelineErrors[sessionID]

        if (!entry && loading) return '<div class="empty">Loading full session timeline...</div>'
        if (!entry && error) return '<div class="empty">' + esc(error) + "</div>"
        if (!entry) return '<div class="empty">Timeline not loaded yet.</div>'

        const body = renderActionList(entry.actions || [])
        return sessionTimelineMeta(entry) + body + (loading ? '<div class="empty">Refreshing timeline...</div>' : "")
      }

      function ensureSessionTimeline(row, force = false) {
        if (!isSessionTimelineRow(row)) return
        const sessionID = String(row.id)
        if (!sessionID) return
        if (state.timelineLoading[sessionID]) return
        if (!force && state.timelineBySession[sessionID]) return

        delete state.timelineErrors[sessionID]
        state.timelineLoading[sessionID] = true

        const query =
          "/api/session-actions?sessionID=" +
          encodeURIComponent(sessionID) +
          "&messageLimit=800&actionLimit=1200"

        fetch(query, { cache: "no-store" })
          .then(async (response) => {
            if (!response.ok) throw new Error(await response.text())
            return response.json()
          })
          .then((payload) => {
            state.timelineBySession[sessionID] = {
              generatedAt: payload.generatedAt,
              messageCount: payload.messageCount,
              actionCount: payload.actionCount,
              actions: Array.isArray(payload.actions) ? payload.actions : [],
            }
          })
          .catch((error) => {
            state.timelineErrors[sessionID] = error?.message || String(error)
          })
          .finally(() => {
            delete state.timelineLoading[sessionID]
            if (state.selectedId === sessionID) renderDetail()
          })
      }

      function renderDetailActions(row) {
        detailActionsEl.innerHTML = ""
        if (!row) return

        if (isSessionTimelineRow(row)) {
          const refreshTimelineBtn = document.createElement("button")
          refreshTimelineBtn.type = "button"
          refreshTimelineBtn.className = "chip"
          refreshTimelineBtn.textContent = "Refresh Full Timeline"
          refreshTimelineBtn.addEventListener("click", () => {
            ensureSessionTimeline(row, true)
            renderDetail()
          })
          detailActionsEl.appendChild(refreshTimelineBtn)
        }

        const deepLink = buildOpenCodeSessionDeepLink(row)
        if (!deepLink) return

        const openBtn = document.createElement("button")
        openBtn.type = "button"
        openBtn.className = "chip"
        openBtn.textContent = "Open in OpenCode (Live)"
        openBtn.addEventListener("click", () => {
          window.location.href = deepLink
        })
        detailActionsEl.appendChild(openBtn)
      }

      function renderDetail() {
        const displayRows = getRowsForLimit()
        const row = state.rows.find((item) => item.id === state.selectedId) || pickPreferredRow(displayRows)
        if (!row) {
          detailTitleEl.textContent = "Select a session"
          detailSubEl.textContent = "Choose a tile on the left to inspect why this session exists and what it did last."
          detailStatusEl.className = "status-pill idle"
          detailStatusEl.innerHTML = '<span class="dot idle"></span><span>idle</span>'
          renderDetailActions(undefined)
          factsEl.innerHTML = ""
          detailBodyEl.innerHTML = '<div class="empty">No session selected yet.</div>'
          return
        }

        state.selectedId = row.id
        detailTitleEl.textContent = row.title
        detailSubEl.textContent = row.titleSource
          ? "Title source: " + row.titleSource + " / updated " + timeText(row.updated)
          : timeText(row.updated)
        detailStatusEl.className = "status-pill " + row.status
        detailStatusEl.innerHTML = '<span class="dot ' + row.status + '"></span><span>' + esc(row.status) + "</span>"
        renderDetailActions(row)
        ensureSessionTimeline(row)
        renderFacts(row)

        const parts = []
        parts.push(renderSection("Why this session exists", esc(row.whyStarted || "No start narrative recorded.")))
        parts.push(
          renderSection("Status reason", esc(row.statusReason || row.detail || "No status narrative recorded.")),
        )
        parts.push(
          renderSection(
            "Next stage",
            row.nextStepTitle
              ? esc(row.nextStepTitle) +
                  (row.nextStepReason
                    ? '<div style="margin-top:8px;color:var(--muted);line-height:1.6;">' +
                      esc(row.nextStepReason) +
                      "</div>"
                    : "")
              : esc(row.nextStepReason || "No explicit next-stage transition recorded."),
          ),
        )
        parts.push(
          renderSection(
            "Decision trail",
            row.reasonTrail?.length
              ? '<div style="display:grid;gap:8px;">' +
                  row.reasonTrail
                    .map(
                      (line) =>
                        '<div class="action"><div class="action-detail" style="margin:0;color:var(--text);">' +
                        esc(line) +
                        "</div></div>",
                    )
                    .join("") +
                  "</div>"
              : '<div class="empty">No retry, decision, or follow-up explanation was recorded for this session.</div>',
          ),
        )
        parts.push(renderSection("Recent actions", renderActionList(row.recentActions)))
        parts.push(renderSection("Full session timeline", renderSessionTimeline(row)))
        parts.push(
          renderSection(
            "Context",
            '<div class="context-grid">' +
              [
                ["Session ID", row.id],
                ["Parent ID", row.parentID || "n/a"],
                ["Directory", row.directory],
                ["Last user", row.lastUser || "n/a"],
              ]
                .map(
                  ([label, value]) =>
                    '<div class="context-item"><div class="context-label">' +
                    esc(label) +
                    '</div><div class="context-value mono">' +
                    esc(value) +
                    "</div></div>",
                )
                .join("") +
              "</div>",
          ),
        )
        detailBodyEl.innerHTML = parts.join("")
      }

      function renderAll() {
        renderSummary(state.rows)
        renderRows(state.rows)
        renderDetail()
      }

      async function load() {
        if (state.refreshing) {
          state.pendingRefresh = true
          return
        }
        state.refreshing = true
        try {
          const requestLimit = Math.max(240, Math.max(1, Number(limitEl.value || LIMIT_DEFAULT)) * 12)
          const response = await fetch("/api/sessions?limit=" + requestLimit, { cache: "no-store" })
          if (!response.ok) throw new Error(await response.text())
          const payload = await response.json()
          state.rows = payload.rows || []
          const hasCurrentSelection = !!state.selectedId && state.rows.some((row) => row.id === state.selectedId)
          if (!hasCurrentSelection) {
            state.hasManualSelection = false
          }
          state.selectedId = chooseSelectedRowID(
            state.rows,
            hasCurrentSelection ? state.selectedId : null,
            state.hasManualSelection,
          )
          renderAll()
          lastUpdatedEl.textContent =
            "Last updated: " + new Date(payload.generatedAt).toLocaleString("zh-CN", { hour12: false })
        } catch (err) {
          lastUpdatedEl.textContent = "Refresh failed: " + (err?.message || err)
        } finally {
          state.refreshing = false
          if (state.pendingRefresh) {
            state.pendingRefresh = false
            load().catch(() => {})
          }
        }
      }

      function restartTimer() {
        if (state.timer) clearInterval(state.timer)
        const seconds = Math.max(1, Number(intervalEl.value || INTERVAL_DEFAULT))
        state.timer = setInterval(() => {
          load().catch(() => {})
        }, seconds * 1000)
      }

      intervalEl.addEventListener("change", restartTimer)
      limitEl.addEventListener("change", () => load().catch(() => {}))
      refreshBtn.addEventListener("click", () => load().catch(() => {}))

      let dragStartX = 0
      let dragStartLeft = 0
      splitter.addEventListener("pointerdown", (event) => {
        dragStartX = event.clientX
        dragStartLeft = state.leftWidth
        splitter.setPointerCapture(event.pointerId)
      })
      splitter.addEventListener("pointermove", (event) => {
        if (!splitter.hasPointerCapture(event.pointerId)) return
        const width = splitRoot.getBoundingClientRect().width
        const delta = ((event.clientX - dragStartX) / width) * 100
        state.leftWidth = Math.min(60, Math.max(30, dragStartLeft + delta))
        splitRoot.style.setProperty("--left-width", state.leftWidth + "%")
      })
      splitter.addEventListener("pointerup", (event) => {
        if (splitter.hasPointerCapture(event.pointerId)) splitter.releasePointerCapture(event.pointerId)
      })
      splitter.addEventListener("pointercancel", (event) => {
        if (splitter.hasPointerCapture(event.pointerId)) splitter.releasePointerCapture(event.pointerId)
      })

      load().catch(() => {})
      restartTimer()
    </script>
  </body>
</html>
